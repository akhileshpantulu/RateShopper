<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rate Shopper</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="classification">INTERNAL // STRICTLY PRIVATE &amp; CONFIDENTIAL</div>
  <header class="topbar">
    <a class="brand" href="#/search"><span class="brand-mark">RATESHOP</span><span class="brand-sub">// compset intelligence</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/search" data-nav="search">Search</a>
      <a href="#/compsets" data-nav="compsets">Compsets</a>
    </nav>
    <div class="status" aria-live="off">
      <span class="status-item"><span class="k">UTC</span> <span id="clock">--:--:--</span></span>
      <span class="status-item"><span class="dot" id="collector-dot"></span><span class="k">COLLECTOR</span> <span id="collector-state">--</span></span>
      <span class="status-item"><span class="k">REQ</span> <span id="req-count">0</span></span>
      <span class="status-item"><span class="k">BLOCKS</span> <span id="block-count">0</span></span>
    </div>
  </header>
  <main id="view" class="page"></main>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/vendor/maplibre/maplibre-gl.js"></script>
  <script src="/static/vendor/maplibre-leaflet/leaflet-maplibre-gl.js"></script>
  <script src="/static/chart.js"></script>
  <script src="/static/map.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
